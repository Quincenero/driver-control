<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo con esquinas redondeadas (estilo app icon) -->
  <rect width="64" height="64" rx="14" fill="#14141d" />

  <!-- Volante -->
  <circle cx="32" cy="27" r="18" stroke="#4ade80" stroke-width="3" fill="none" />
  <circle cx="32" cy="27" r="8" stroke="#4ade80" stroke-width="2.5" fill="none" />

  <!-- Radios del volante -->
  <line x1="32" y1="9" x2="32" y2="19" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="35" x2="32" y2="45" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="27" x2="24" y2="27" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="27" x2="50" y2="27" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" />

  <!-- Carretera -->
  <path
    d="M16 48 Q32 55, 48 48"
    stroke="#60a5fa"
    stroke-width="2.5"
    fill="none"
    stroke-dasharray="3.5 3.5"
    stroke-linecap="round"
  />
</svg>